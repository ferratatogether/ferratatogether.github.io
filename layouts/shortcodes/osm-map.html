     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>


<div class="alpine-map-wrapper">
  <div id="swiss-osm-map"></div>
  <div class="alpine-sidebar">
    <!-- Filter Checkboxes Panel -->
    <div class="filter-panel">
      <h5>🎯 Filter by Difficulty</h5>
      <div class="filter-group">
        <label class="filter-label">
          <input type="checkbox" class="difficulty-filter" value="easy" checked>
          <span class="filter-status-dot" style="background:#22c55e;"></span> K1 - K2 (Easy)
        </label>
        <label class="filter-label">
          <input type="checkbox" class="difficulty-filter" value="medium" checked>
          <span class="filter-status-dot" style="background:#eab308;"></span> K3 - K4 (Medium)
        </label>
        <label class="filter-label">
          <input type="checkbox" class="difficulty-filter" value="hard" checked>
          <span class="filter-status-dot" style="background:#ef4444;"></span> K5 - K6 (Expert)
        </label>
      </div>
    </div>

    <!-- Dynamic Route Context Content Container -->
    <div id="map-sidebar-content">
      <div class="sidebar-placeholder">
        <h4>🏔️ Swiss Alpine Routes</h4>
        <p>Hover over a route marker to explore topographic details, difficulty metrics, and climbing logistics.</p>
      </div>
    </div>
  </div>
</div>

<style>
  .alpine-map-wrapper {
    display: flex;
    flex-direction: row;
    width: 100%;
    height: 70vh;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    margin: 24px 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #swiss-osm-map {
    flex: 2;
    height: 100% !important;
    z-index: 1;
  }
  .alpine-sidebar {
    flex: 1;
    height: 100%;
    background: #1e293b;
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    border-left: 2px solid #334155;
  }
  .filter-panel {
    background: #0f172a;
    padding: 16px 20px;
    border-bottom: 2px solid #334155;
  }
  .filter-panel h5 { margin: 0 0 10px 0; color: #94a3b8; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
  .filter-group { display: flex; flex-direction: column; gap: 8px; }
  .filter-label { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: #cbd5e1; cursor: pointer; user-select: none; }
  .filter-label input { cursor: pointer; margin: 0; }
  .filter-status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  
  #map-sidebar-content { padding: 24px; overflow-y: auto; flex-grow: 1; }
  
  @media (max-width: 768px) {
    .alpine-map-wrapper { flex-direction: column; height: 850px; }
    .alpine-sidebar { border-left: none; border-top: 2px solid #334155; }
  }
  
  .sidebar-route-title { margin-top: 0; color: #f1f5f9; font-size: 1.3rem; font-weight: 700; }
  .sidebar-difficulty-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; margin: 10px 0 16px 0; color: #fff; }
  .sidebar-summary { color: #cbd5e1; font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px; }
  .sidebar-link { display: inline-block; background: #3b82f6; color: white !important; text-decoration: none !important; padding: 8px 16px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; }
  .sidebar-link:hover { background: #2563eb; }

  #swiss-osm-map img.leaflet-tile { max-width: none !important; max-height: none !important; }
  .custom-climb-marker { display: flex; align-items: center; justify-content: center; }
  .marker-pin-body { width: 32px; height: 32px; border-radius: 50% 50% 50% 0; position: absolute; transform: rotate(-45deg); left: 50%; top: 50%; margin: -16px 0 0 -16px; border: 2px solid #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; }
  .marker-pin-body span { transform: rotate(45deg); color: white; font-weight: 800; font-size: 11px; }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var map = L.map('swiss-osm-map');

    L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      maxZoom: 17,
      attribution: 'Map data &copy; OpenStreetMap contributors, OpenTopoMap'
    }).addTo(map);

    var locations = [
      {{ range $index, $element := .Site.Data.ferratas }}
        {{ if $index }},{{ end }}
        {
          name: "{{ $element.name | safeJS }}",
          lat: {{ $element.lat }},
          lon: {{ $element.lon }},
          difficulty: "{{ $element.difficulty | safeJS }}",
          summary: "{{ $element.summary | safeJS }}",
          url: "{{ $element.url | relURL | safeJS }}"
        }
      {{ end }}
    ];

    function getDifficultyTier(diff) {
      var d = diff.toUpperCase();
      if (d === 'K1' || d === 'K2') return 'easy';
      if (d === 'K3' || d === 'K4') return 'medium';
      if (d === 'K5' || d === 'K6') return 'hard';
      return 'unknown';
    }

    function getDifficultyColor(diff) {
      var d = diff.toUpperCase();
      if (d === 'K1' || d === 'K2') return '#22c55e';
      if (d === 'K3' || d === 'K4') return '#eab308';
      if (d === 'K5' || d === 'K6') return '#ef4444';
      return '#64748b';
    }

    var markerObjects = []; // Stores instantiated Leaflet layers bound to data properties
    var contentPanel = document.getElementById('map-sidebar-content');

    locations.forEach(function(loc) {
      var color = getDifficultyColor(loc.difficulty);
      var tier = getDifficultyTier(loc.difficulty);
      
      var customIcon = L.divIcon({
        className: 'custom-climb-marker',
        iconSize: '10px',
        iconAnchor: '10px',
        html: '<div class="marker-pin-body" style="background-color:' + color + ';"><span>' + loc.difficulty + '</span></div>'
      });

      var marker = L.marker([loc.lat, loc.lon], { icon: customIcon }).addTo(map);
      marker.bindTooltip(loc.name, { direction: 'top', offset: [0, -32] });
      
      marker.on('mouseover', function() {
        contentPanel.innerHTML = `
          <h3 class="sidebar-route-title">${loc.name}</h3>
          <span class="sidebar-difficulty-badge" style="background-color:${color}">${loc.difficulty} Rating</span>
          <p class="sidebar-summary">${loc.summary}</p>
          <a href="${loc.url}" class="sidebar-link">Open Route Details &rarr;</a>
        `;
      });

      marker.on('click', function() {
        window.location.href = loc.url;
      });

      // Track marker instances alongside meta properties for rendering filters
      markerObjects.push({
        layer: marker,
        tier: tier,
        lat: loc.lat,
        lon: loc.lon
      });
    });

    // Re-calculates which pins are rendered and adjusts the map viewpoint bounds
    function updateMapFilters() {
      // Gather list of active checked values: ['easy', 'medium', 'hard']
      var activeTiers = Array.from(document.querySelectorAll('.difficulty-filter:checked')).map(cb => cb.value);
      var visibleBounds = [];

      markerObjects.forEach(function(obj) {
        if (activeTiers.includes(obj.tier)) {
          // Show marker if its tier is checked
          if (!map.hasLayer(obj.layer)) {
            map.addLayer(obj.layer);
          }
          visibleBounds.push([obj.lat, obj.lon]);
        } else {
          // Remove marker layer if unchecked
          if (map.hasLayer(obj.layer)) {
            map.removeLayer(obj.layer);
          }
        }
      });

      // Smoothly re-frame visible coordinates canvas context
      if (visibleBounds.length > 0) {
        map.flyToBounds(visibleBounds, { padding: [40, 40], duration: 0.5 });
      } else {
        map.flyTo([46.8182, 8.2275], 8);
      }
    }

    // Attach interaction change listener events to all difficulty filter elements
    document.querySelectorAll('.difficulty-filter').forEach(function(checkbox) {
      checkbox.addEventListener('change', updateMapFilters);
    });

    // Initial positioning setup on load
    var initialBounds = markerObjects.map(obj => [obj.lat, obj.lon]);
    if (initialBounds.length > 0) {
      map.fitBounds(initialBounds, { padding: [40, 40] });
    } else {
      map.setView([46.8182, 8.2275], 8);
    }

    setTimeout(function() {
      map.invalidateSize();
      if (initialBounds.length > 0) {
        map.fitBounds(initialBounds, { padding: [40, 40] });
      }
    }, 250);
  });
</script>
