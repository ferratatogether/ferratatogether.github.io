<div class="meetup-card" style=" padding: 10px; border-radius: 8px; 
font-family: sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">  
  <div style="margin-bottom: 12px;">
    <strong>🕒 Meeting Time:</strong> {{ .Get "meetTime" }}
  </div>
  
  <div style="margin-bottom: 12px;">
    <strong>🚉 Train Departure:</strong> {{ .Get "leaveTime" }}
  </div>
  
  <div style="margin-bottom: 16px;">
    <strong>🛤️ Platform:</strong> Track {{ .Get "platform" }}
  </div>
  
  <div style="margin-top: 15px;">
    <strong>📍 Meeting Point Location:</strong>
    <p style="font-size: 0.9em; color: #666; margin: 5px 0 10px 0;">
        Zurich Main Station (HB) Main Hall — Under the "L'Ange Protecteur" Guardian Angel statue.</p>
        <img src="/img/ange.jpg" width="100%">

</div>
