integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com" 
integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<!-- Split-Pane Interactive Grid Layout -->
<div class="alpine-map-wrapper">
  <div id="swiss-osm-map"></div>
  <div class="alpine-sidebar" id="map-sidebar">
    <div class="sidebar-placeholder">
      <h4>🏔️ Swiss Alpine Routes</h4>
      <p>Hover over a route marker to explore topographic details, difficulty metrics, and climbing logistics.</p>
    </div>
  </div>
</div>

<!-- Styling for Layout Grid, Topo Theme, and Custom CSS Pins -->
<style>
  .alpine-map-wrapper {
    display: flex;
    flex-direction: row;
    width: 100%;
    height: 550px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    margin: 24px 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #swiss-osm-map {
    flex: 2;
    height: 100% !important;
    z-index: 1;
  }
  .alpine-sidebar {
    flex: 1;
    height: 100%;
    background: #1e293b; /* Dark mountain granite aesthetic */
    color: #f8fafc;
    padding: 24px;
    box-sizing: border-box;
    overflow-y: auto;
    border-left: 2px solid #334155;
    transition: all 0.2s ease;
  }
  @media (max-width: 768px) {
    .alpine-map-wrapper { flex-direction: column; height: 750px; }
    .alpine-sidebar { border-left: none; border-top: 2px solid #334155; }
  }
  
  /* Sidebar typography styling */
  .sidebar-route-title { margin-top: 0; color: #f1f5f9; font-size: 1.3rem; font-weight: 700; line-height: 1.3; }
  .sidebar-difficulty-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 0.85rem;
    margin: 10px 0 16px 0;
    text-transform: uppercase;
    color: #fff;
  }
  .sidebar-summary { color: #cbd5e1; font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px; }
  .sidebar-link {
    display: inline-block;
    background: #3b82f6;
    color: white !important;
    text-decoration: none !important;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 600;
    transition: background 0.15s ease;
  }
  .sidebar-link:hover { background: #2563eb; }

  /* Map Tile Override fix */
  #swiss-osm-map img.leaflet-tile { max-width: none !important; max-height: none !important; }

  /* Custom Pure CSS Difficulty Markers */
  .custom-climb-marker { display: flex; align-items: center; justify-content: center; }
  .marker-pin-body {
    width: 32px;
    height: 32px;
    border-radius: 50% 50% 50% 0;
    background: #334155;
    position: absolute;
    transform: rotate(-45deg);
    left: 50%;
    top: 50%;
    margin: -16px 0 0 -16px;
    border: 2px solid #ffffff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .marker-pin-body span {
    transform: rotate(45deg);
    color: white;
    font-weight: 800;
    font-size: 11px;
    letter-spacing: -0.5px;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    var map = L.map('swiss-osm-map');

    // Official open topo map overlay variant for high-fidelity alpine relief lines
    L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      maxZoom: 17,
      attribution: 'Map data: &copy; <a href="https://openstreetmap.org">OpenStreetMap</a> contributors, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org">CC-BY-SA</a>)'
    }).addTo(map);

    var locations = [
      {{ range $index, $element := .Site.Data.ferratas }}
        {{ if $index }},{{ end }}
        {
          name: "{{ $element.name | safeJS }}",
          lat: {{ $element.lat }},
          lon: {{ $element.lon }},
          difficulty: "{{ $element.difficulty | safeJS }}",
          summary: "{{ $element.summary | safeJS }}",
          url: "{{ $element.url | relURL | safeJS }}"
        }
      {{ end }}
    ];

    // Map difficulty tiers to official alpine safety color tags
    function getDifficultyColor(diff) {
      var d = diff.toUpperCase();
      if (d === 'K1' || d === 'K2') return '#22c55e'; // Green: Easy / Beginner
      if (d === 'K3' || d === 'K4') return '#eab308'; // Yellow/Orange: Advanced Intermediate
      if (d === 'K5' || d === 'K6') return '#ef4444'; // Red: Expert / Vertical exposure
      return '#64748b';
    }

    var markerBounds = [];
    var sidebar = document.getElementById('map-sidebar');
    var defaultSidebarContent = sidebar.innerHTML;

    locations.forEach(function(loc) {
      var color = getDifficultyColor(loc.difficulty);
      
      // Generate clean HTML markers with explicit text inside
      var customIcon = L.divIcon({
        className: 'custom-climb-marker',
        iconSize: '10px',      // Defines the pixel size of the marker container
        iconAnchor: '10px',    // Anchors the bottom-center point of the pin to the map coordinate
        html: '<div class="marker-pin-body" style="background-color:' + color + ';"><span>' + loc.difficulty + '</span></div>'
      });

      var marker = L.marker([loc.lat, loc.lon], { icon: customIcon }).addTo(map);
      marker.bindTooltip(loc.name, { direction: 'top', offset: [0, -40] });
      
      // Core Mouse Events for Sidebar Updates
      marker.on('mouseover', function() {
        sidebar.innerHTML = `
          <h3 class="sidebar-route-title">${loc.name}</h3>
          <span class="sidebar-difficulty-badge" style="background-color:${color}">${loc.difficulty} Difficulty Rating</span>
          <p class="sidebar-summary">${loc.summary}</p>
          <a href="${loc.url}" class="sidebar-link">Open Route Blueprint &rarr;</a>
        `;
      });

      marker.on('mouseout', function() {
        // Keeps the content loaded unless they look somewhere completely raw
      });

      marker.on('click', function() {
        window.location.href = loc.url;
      });

      markerBounds.push([loc.lat, loc.lon]);
    });

    // Auto view framing adjustment logic
    if (markerBounds.length > 0) {
      map.fitBounds(markerBounds, { padding: [40, 40] }); // Added [40, 40] pixel buffer padding
    } else {
      map.setView([46.8182, 8.2275], 8);
    }

    setTimeout(function() {
      map.invalidateSize();
      if (markerBounds.length > 0) {
        map.fitBounds(markerBounds, { padding: [50, 50] });
      }
    }, 250);
  });
</script>
