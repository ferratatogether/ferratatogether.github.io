{{/* layouts/shortcodes/google-map-directions.html */}}
{{ $origin := .Get "origin" }}
{{ $destination := .Get "destination" }}
{{ $mode := .Get "mode" | default "d" }}
{{ $height := .Get "height" | default "450" }}

<div class="map-container" style="margin: 2rem 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

<div class="map-wrapper" style="border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.05); margin: 2rem 0;">
  <iframe
    width="100%"
    height="{{ $height }}"
    style="border:0;"
    loading="lazy"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade"
    src="https://maps.google.com/maps?f=d&saddr={{ $origin }}&daddr={{ $destination }}&dirflg={{ $mode }}&output=embed">
  </iframe>
</div>

  <!-- Fancy Get Directions Button Layer -->
  <div class="map-action" style="margin-top: 0.75rem; text-align: right;">
    <a href="https://www.google.com/maps/dir/?api=1&origin={{ $origin | urlquery }}&destination={{ $destination | urlquery }}&travelmode={{ if eq $mode "r" }}transit{{ else if eq $mode "w" }}walking{{ else if eq $mode "b" }}bicycling{{ else }}driving{{ end }}" 
       target="_blank" 
       rel="noopener noreferrer" 
       style="display: inline-flex; align-items: center; gap: 8px; background-color: #1a73e8; color: #ffffff; padding: 10px 18px; border-radius: 8px; font-size: 0.9rem; font-weight: 500; text-decoration: none; box-shadow: 0 2px 6px rgba(26,115,232,0.2); transition: background-color 0.2s ease, transform 0.1s ease;">
      <!-- Minimalist Arrow/Navigation Icon Built with SVG -->
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate(45deg);">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
      Open Directions in Google Maps
    </a>
  </div>
</div>
